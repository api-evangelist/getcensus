x-enrichment:
  date: '2026-08-13'
  status: enriched
  artifacts_added: 13
  pass: local-v1
  notes: 'Contract discovery (STEP 0b) ran against every host and found no OpenAPI, GraphQL SDL, AsyncAPI or MCP surface for the Census Management API. The per-endpoint API reference pages on fivetran.com link to https://fivetran.com/assets-docs/openapi/file_v1.yaml, which the STEP 0c ownership check REJECTED: it is Fivetran''s core REST API spec (info.title "OpenAPI Definition", servers https://api.fivetran.com, basicAuth, /v1/connections...) with zero Activations or getcensus paths, so it does not describe this API and was deliberately not saved.'
