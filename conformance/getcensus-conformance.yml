    note: >-
      No security.txt, responsible-disclosure page, or public bug bounty program (HackerOne,
      Bugcrowd, Intigriti) was found for getcensus.com or fivetran.com on 2026-08-13, so no
      VulnerabilityDisclosure or Security pointer is emitted.
