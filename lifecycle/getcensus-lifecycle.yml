  title: Streamlining Fivetran Activations
  source: https://whatsnew.getcensus.com/streamlining-fivetran-activations-upcoming-changes-to-make-fivetran-activations-easier-and-more-accessible-340063
  summary: >-
    Second phase of folding Census into Fivetran. Activation Sources move toward Fivetran
    Destinations; Activations moves into Fivetran's clouds and regions; Activations adopts Fivetran's
    access controls (SCIM, team management, finer-grained permissions); workspaces are being retired;
    and activation syncs are regrouped into individual activations "in the UI and API, exactly like
    connections in Fivetran today". This is a stated forthcoming breaking change to the API surface
    profiled here.
