name: Census (Fivetran Activations) — candidate MCP tool surface
description: >-
  Census ships NO MCP server. This file is a CANDIDATE tool surface an implementer could build over
  the Census Management API; it is not a product, not an endpoint, and it is deliberately NOT wired
  as a `type: MCPServer` pointer in apis.yml, because that pointer asserts the provider operates an
  agent surface and Census does not.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: api-key
  verified: searched
search_evidence:
  - checked: Activations documentation (fivetran.com/docs/activations/**)
    result: no MCP server, no /mcp endpoint, no agent surface documented
  - checked: https://fivetran.com/llms.txt
    result: >-
      Two MCP pages exist under /docs/context-layer/ — "Agent Context MCP" and its setup guide — but
      they belong to Fivetran's Context Layer product, NOT to Activations/Census. They expose an
      organization's context layer to AI agents; they do not expose the Census Management API. This
      is recorded as a Fivetran surface and is deliberately NOT claimed for this profile.
  - checked: npm registry (@getcensus/*, census-*, getcensus)
    result: no first-party MCP package
  - checked: github.com/sutrolabs
    result: no MCP server repository
gaps_blocking_a_real_server:
  - No OpenAPI is published for the Census Management API, so tool inputSchemas cannot be generated
    from a contract — they would have to be hand-written against undocumented request bodies.
  - The per-endpoint reference pages publish no parameters, request bodies or response schemas.
