    name: sutrolabs/census
    url: https://registry.terraform.io/providers/sutrolabs/census/latest
    source: https://github.com/sutrolabs/terraform-provider-census
    install: |
      terraform {
        required_providers {
          census = {
            source  = "sutrolabs/census"
            version = "~> 0.2.0"
          }
        }
      }
    official: true
    version: 0.2.17
    published: '2026-08-05'
    downloads: 24033
    tier: community
    docs: https://fivetran.com/docs/activations/rest-api/terraform
    description: >-
      Activations Terraform Provider — manages Activations resources as infrastructure as code.
      Authenticates with an Activations personal access token (CENSUS_PERSONAL_ACCESS_TOKEN) and
      takes a region argument (us | eu | au).
