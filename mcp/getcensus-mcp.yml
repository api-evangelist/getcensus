candidate_tools_note: >-
  Each source_operation above names a real, published Activations API reference page
  (https://fivetran.com/docs/activations/rest-api/api-reference/<path>). No HTTP method or URL path
  is asserted here: the provider publishes neither an OpenAPI nor per-endpoint request/response
  detail, and only https://app.getcensus.com/api/v1/syncs appears verbatim in the documentation.
  An implementer must resolve method, path, parameters and request bodies against the live API.
