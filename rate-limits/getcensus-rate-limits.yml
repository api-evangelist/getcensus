destination_side_limits:
  note: >-
    What Activations DOES document about rate limits concerns the destination services it syncs into,
    not its own API: it honours a Retry-After header returned by a destination, surfaces destination
    429s in the API Inspector, and retries failed batches with exponential backoff plus split-batch
    upload.
  source: https://fivetran.com/docs/activations/syncs/retry-handling
