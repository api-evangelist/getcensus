note: >-
  Census serves NO /.well-known/ document on any of its hosts. Every path was probed on 2026-08-13
  and every one missed. Three distinct failure shapes were observed and none of them is a document:
  www.getcensus.com returns HTTP 404 with the marketing SPA body; app.getcensus.com and
  app-eu.getcensus.com return HTTP 403 with an S3 AccessDenied XML body; and
  developers.getcensus.com returns HTTP 200 for EVERY path with an identical 79,466-byte Next.js
  shell — a catch-all, not a served document. No WellKnown, SecurityTxt, APICatalog or AgentCard
  pointer is emitted in apis.yml as a result.
