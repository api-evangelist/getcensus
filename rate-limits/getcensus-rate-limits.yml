notes: >-
  Census publishes NO numeric rate limit for its Management API — no requests-per-second/minute/hour
  figure, no burst allowance, no per-plan tiering, and no documented response headers. The whole
  Activations documentation set was searched on 2026-08-13 (including the API reference introduction,
  authentication and pagination pages) and it contains no rate-limit section for this API. An honest
  zero: limit_count is 0 because the provider documents none, not because none were looked for.
