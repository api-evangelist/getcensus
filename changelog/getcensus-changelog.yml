    category: Changelog
    title: Activations User List and Invitation APIs deprecated
    breaking: true
    highlights:
      - Organization Users and Invitations endpoints deprecated.
      - Replaced by Fivetran's core Users endpoints, which use Fivetran's standard auth.
      - Users match across the two systems by email address, not by ID.
      - Developers advised to run both API keys in parallel during the transition.
