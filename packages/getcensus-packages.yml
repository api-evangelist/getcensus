note: >-
  Census (now Fivetran Activations) publishes no conventional REST client SDK — there is no
  first-party JavaScript, Python, Go, Ruby, Java or .NET library for the Management API, and no
  npm/RubyGems/NuGet/Maven package exists under a Census or getcensus namespace. What the company
  does ship first-party are three infrastructure/orchestration clients, all published from its
  engineering org github.com/sutrolabs and all named in its own documentation.
packages:
