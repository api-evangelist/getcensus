  - date: '2026-06-17'
    category: Coming Soon
    title: Streamlining Fivetran Activations - upcoming changes to the product and the API
    breaking: true
    highlights:
      - Activation Sources move toward working like Fivetran Destinations.
      - Activations moves into Fivetran's clouds and regions, starting with GCP.
      - Activations adopts Fivetran access controls (SCIM, team management, finer-grained permissions).
      - Workspaces are going away.
      - Activation syncs are regrouped into individual activations in the UI and the API.
